# nginx del LXC 144: estático (la app) + proxies a los dos procesos.
# /            → public/ (index.html, dmr.html, assets)
# /api/        → dmrsim -serve (dmrapi: topología/simulado/política; también
#                /api/plans si se monta shareapi — mismo prefijo)
# /v1/         → asistente agéntico (formato OpenAI)
server {
    listen 80 default_server;
    server_name _;

    root /opt/hopreach/public;
    index index.html;

    # gzip para texto y json (el wasm lo sirve docker; acá no está en juego)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # /api/* → el proceso Go
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # /v1/* → asistente (chat completions + UX). El streaming SSE exige
    # desactivar buffering en nginx o el widget recibe todo al final.
    location /v1/ {
        proxy_pass http://127.0.0.1:18096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # /health → diagnóstico del asistente sin entrar al servidor.
    location = /health {
        proxy_pass http://127.0.0.1:18096/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # DEM tiles para el cliente WASM del mapa de cobertura (mismo cache
    # de tiles que usa el server; el browser no toca S3 directamente).
    location /dem-tiles/ {
        alias /opt/hopreach/dem-cache/;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
