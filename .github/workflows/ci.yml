# CI for the DMR fork on the house self-hosted runner (LXC 143).
#
# The Go stack is self-sufficient here: no GPU, no Docker builds, no Python
# — just build + vet + the full Go test matrix, plus the one end-to-end
# smoke that matters: the DMR CLI runs the bundled Cordillera example
# headless against the real terrarium DEM (fspl_mode must be OFF in the
# report; the smoke fails if the terrain never made it into the margins).

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  go:
    runs-on: [self-hosted, hopreach]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: go build ./...
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test ./...
        run: go test ./...

      - uses: actions/cache@v4
        with:
          path: dem-cache
          key: dem-cache-cordillera

      - name: dmrsim smoke — ejemplo Cordillera con DEM real
        env:
          HOPREACH_CONFIG: ""
        run: |
          set -euo pipefail
          OUT=$(go run ./cmd/dmrsim \
            -network examples/dmr/dmr-network.example.yaml \
            -scenario examples/dmr/scenario.example.yaml -md)
          echo "$OUT" | head -40
          case "$OUT" in
            *"Cordillera Santiago"*) echo "red del ejemplo cargada ✓" ;;
            *) echo "FAIL: el reporte no nombró la red del ejemplo"; exit 1 ;;
          esac
          if echo "$OUT" | grep -q "FSPL sin terreno"; then
            echo "FAIL: la corrida no vio terreno (fspl); ¿cayó la descarga del DEM terrarium?"
            exit 1
          fi
          echo "terreno modelado ✓ (fspl_mode=false)"

  frontend:
    runs-on: [self-hosted, hopreach]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: refs + unit tests del front (node --test)
        run: |
          npm install --no-audit --no-fund
          npm run test:refs
          npm run test:unit
